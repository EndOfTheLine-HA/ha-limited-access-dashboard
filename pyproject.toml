[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-guest-portal"
version = "0.1.0"
description = "Least-privilege guest controls for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CJ Zwart" }]
dependencies = [
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.18,<1",
  "pyyaml>=6.0,<7",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
ha-guest-portal = "guest_portal.cli:main"

[tool.setuptools.packages.find]
include = ["guest_portal*"]

[tool.setuptools.package-data]
guest_portal = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

