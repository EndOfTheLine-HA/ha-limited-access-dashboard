services:
  portal:
    build: .
    restart: unless-stopped
    ports:
      - "${PORTAL_BIND_IP:-127.0.0.1}:${PORTAL_PORT:-8787}:8787"
    environment:
      SPRINKLER_WEBHOOK_ID: "${SPRINKLER_WEBHOOK_ID}"
      GUEST_HOME_WEBHOOK_ID: "${GUEST_HOME_WEBHOOK_ID}"
      LANDSCAPER_PASSWORD_HASH: "${LANDSCAPER_PASSWORD_HASH}"
      CHILD_PASSWORD_HASH: "${CHILD_PASSWORD_HASH}"
      RENTAL_PASSWORD_HASH: "${RENTAL_PASSWORD_HASH}"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - portal-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  portal-data:

