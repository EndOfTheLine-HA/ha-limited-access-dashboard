name: CI

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install homeassistant==2026.9.4 argon2-cffi==25.1.0
      - run: python tests/verify_ha_flow.py "$PWD"
      - run: python tests/verify_editor_backend.py "$PWD"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: node --test tests/test_refresh.cjs
      - run: python scripts/build_release.py
      - run: pip-audit --skip-editable

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t limited-access-dashboard:test .
      - name: Test installed application in Python 3.14 container
        run: |
          docker run --rm --user root --entrypoint sh -v "$PWD/tests:/tests:ro" -v "$PWD/custom_components:/custom_components:ro" -v "$PWD/scripts:/scripts:ro" limited-access-dashboard:test -c 'apt-get update && apt-get install -y --no-install-recommends git && pip install pytest httpx && python -m pytest /tests -q'

