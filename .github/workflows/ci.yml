name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: pip-audit --skip-editable

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t limited-access-dashboard:test .
      - name: Test installed application in Python 3.14 container
        run: |
          docker run --rm --user root --entrypoint sh -v "$PWD/tests:/tests:ro" -v "$PWD/custom_components:/custom_components:ro" limited-access-dashboard:test -c 'pip install pytest httpx && python -m pytest /tests -q'

