# All names and dates below are fictional examples.
# Include this file from configuration.yaml with:
# limited_access_dashboard: !include limited_access_dashboard.yaml
#
# Put the Argon2 hash in secrets.yaml. Generate it with:
# ha-limited-access-dashboard hash-password

title: "Sprinkler Controls"
timezone: "UTC"
base_path: "/limited-access-dashboard"
session_hours: 8
cookie_secure: true
database_path: "/config/limited-access-dashboard-data/dashboard.db"
duration_minutes: 5

account:
  username: "contractor-example"
  display_name: "Contractor"
  password_hash: !secret limited_access_dashboard_example_hash
  active_from: "2030-01-15T06:00:00+00:00"
  expires_at: "2030-01-20T20:00:00+00:00"

schedule:
  monday: ["06:00-14:45"]
  tuesday: ["06:00-14:45"]
  wednesday: ["06:00-14:45"]
  thursday: ["06:00-14:45"]
  friday: ["06:00-14:45"]
  saturday: ["06:00-14:45"]
  sunday: ["06:00-14:45"]

zones:
  front_left:
    name: "Front left grass"
    entity_id: switch.replace_with_front_left_zone
  roses:
    name: "Roses"
    entity_id: switch.replace_with_roses_zone
